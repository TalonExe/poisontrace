[project]
name = "poisontrace"
version = "0.1.0"
description = "Sandboxed evaluation of MCP tool-poisoning attacks against SOC agents"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "PyYAML>=6.0,<7.0",
    "openai>=1.0,<2.0",
    "google-genai>=1.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
