[project]
name = "poisontrace"
version = "0.1.0"
description = "Sandboxed evaluation of MCP tool-poisoning attacks against SOC agents"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0", "jsonschema>=4.20,<5", "PyYAML>=6,<7",
    "openai>=1,<2", "google-genai>=1,<2", "cryptography>=46,<51",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
web = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.setuptools.package-data]
"poisontrace.adapters.mcp" = ["*.json", "corpus/*.json"]
"poisontrace" = ["seeds/scenarios/*.yaml"]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]
